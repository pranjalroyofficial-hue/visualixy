                <div class="text-center max-w-lg mx-auto">

                </div>
            </div>
        </aside>
    </main>

    <script>
        function generateInvoicePDF() {
            const btn = document.getElementById('printBtn');
            const bName = document.getElementById('bName').value.trim() || "Business Store";
            const cName = document.getElementById('cName').value.trim() || "Valued Customer";
            const item = document.getElementById('itemName').value.trim() || "Service/Item";
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            const gst = parseFloat(document.getElementById('gstRate').value) || 0;

            const taxAmount = (price * gst) / 100;
            const total = price + taxAmount;

            const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Invoice - ${bName}</title>
                    <style>
                        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; color: #1e293b; }
                        .inv-header { display: flex; justify-content: space-between; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
                        th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: left; font-size: 14px; }
                        th { background-color: #f1f5f9; }
                        .total-box { margin-top: 25px; text-align: right; }
                        .footer-note { margin-top: 60px; font-size: 12px; color: #94a3b8; text-align: center; }
                    </style>
                </head>
                <body>
                    <div class="inv-header">
                        <div>
                            <h2 style="margin:0; color:#2563eb;">TAX INVOICE / CASH MEMO</h2>
                            <p style="margin:5px 0; font-weight:bold;">${bName}</p>
                        </div>
                        <div style="text-align:right;">
                            <p style="margin:2px 0;"><b>Date:</b> ${new Date().toLocaleDateString('en-GB')}</p>
                            <p style="margin:2px 0;"><b>Bill To:</b> ${cName}</p>
                        </div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>Item Description</th>
                                <th>Base Price</th>
                                <th>GST Rate</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${item}</td>
                                <td>₹${price.toFixed(2)}</td>
                                <td>${gst}% (₹${taxAmount.toFixed(2)})</td>
                                <td><b>₹${total.toFixed(2)}</b></td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="total-box">
                        <h3>Grand Total Payable: ₹${total.toFixed(2)}</h3>
                    </div>

                    <div class="footer-note">
                        <p>Generated via Visualixy.in • 100% Client-Side Privacy Guaranteed</p>
                    </div>

                    <script>
                        window.onload = function() {
                            window.print();
                        };
                    <\/script>
                </body>
                </html>
            `;

            // Trigger Ads Engine & Launch Print Window
            window.triggerToolProcessAndDownload(btn, "Generating Official Invoice", function() {
                const printWindow = window.open('', '_blank');
                if (printWindow) {
                    printWindow.document.open();
                    printWindow.document.write(printContent);
                    printWindow.document.close();
                } else {
                    alert("Please allow popups for printing invoice.");
                }
            });
        }
    </script>
</body>
</html>

    <script>
        let frontImg = null;
        let backImg = null;

        function loadFile(input, side) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        if (side === 'front') {
                            frontImg = img;
                            document.getElementById('frontLabel').innerText = "✓ Front Loaded";
                        } else {
                            backImg = img;
                            document.getElementById('backLabel').innerText = "✓ Back Loaded";
                        }
                        if (frontImg && backImg) {
                            document.getElementById('previewArea').classList.remove('hidden');
                            renderA4();
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function renderA4() {
            const canvas = document.getElementById('a4Canvas');
            const ctx = canvas.getContext('2d');

            // A4 Ratio (1240 x 1754 px)
            canvas.width = 1240;
            canvas.height = 1754;

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Card Standard Dimensions
            const cardW = 600;
            const cardH = 380;
            const posX = (canvas.width - cardW) / 2;

            // Front Card
            const posY1 = 200;
            ctx.drawImage(frontImg, posX, posY1, cardW, cardH);
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 2;
            ctx.strokeRect(posX, posY1, cardW, cardH);

            // Back Card
            const posY2 = posY1 + cardH + 100;
            ctx.drawImage(backImg, posX, posY2, cardW, cardH);
            ctx.strokeRect(posX, posY2, cardW, cardH);

            // Cut Line Indicator
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = "#cbd5e1";
            ctx.beginPath();
            ctx.moveTo(100, posY1 + cardH + 50);
            ctx.lineTo(canvas.width - 100, posY1 + cardH + 50);
            ctx.stroke();
            ctx.setLineDash([]);

            // Label Text
            ctx.fillStyle = "#94a3b8";
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("✂️ Fold or Cut Along the Dotted Line", canvas.width / 2, posY1 + cardH + 55);
        }

        function downloadA4Sheet() {
            const btn = document.getElementById('downloadA4Btn');
            window.triggerToolProcessAndDownload(btn, "Rendering High-Res A4 Sheet", function() {
                const canvas = document.getElementById('a4Canvas');
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.download = "Visualixy_ID_Card_A4_Print.jpg";
                link.click();
            });
        }
    </script>

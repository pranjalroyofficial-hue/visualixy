    <!-- Logic Engine -->
    <script>
        let rawImage = null;
        let targetKB = 19;
        let processedBlob = null;

        const dropArea = document.getElementById('dropArea');
        const imageInput = document.getElementById('imageInput');
        const controlPanel = document.getElementById('controlPanel');

        dropArea.onclick = () => imageInput.click();

        imageInput.onchange = (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        };

        function handleFile(file) {
            document.getElementById('originalInfo').innerText = `Original: ${(file.size / 1024).toFixed(1)} KB`;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    rawImage = img;
                    document.getElementById('previewImg').src = e.target.result;
                    dropArea.classList.add('hidden');
                    controlPanel.classList.remove('hidden');
                    compressToTarget();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setPreset(kb, btn) {
            targetKB = kb;
            document.querySelectorAll('.preset-btn').forEach(b => {
                b.className = 'preset-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-xs font-bold text-center';
            });
            btn.className = 'preset-btn active py-2.5 px-3 rounded-xl border border-blue-600 bg-blue-50 text-blue-700 text-xs font-bold text-center';
            document.getElementById('btnSizeTag').innerText = (kb + 1) + 'KB';
            compressToTarget();
        }

        function resetTool() {
            rawImage = null;
            imageInput.value = '';
            dropArea.classList.remove('hidden');
            controlPanel.classList.add('hidden');
        }

        async function compressToTarget() {
            if (!rawImage) return;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Standard Exam Passport Ratio
            let width = 350;
            let height = 450;
            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(rawImage, 0, 0, width, height);

            let quality = 0.92;
            let blob = null;

            for (let i = 0; i < 15; i++) {
                blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                if ((blob.size / 1024) <= targetKB || quality <= 0.1) {
                    break;
                }
                quality -= 0.08;
            }

            processedBlob = blob;
            document.getElementById('targetStatus').innerText = `Final Size: ${(blob.size / 1024).toFixed(1)} KB (Within Target)`;
        }

        function executeDownload() {
            if (!processedBlob) return;
            const btn = document.getElementById('downloadBtn');
            window.triggerToolProcessAndDownload(btn, "Formatting Exact KB File", function() {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(processedBlob);
                link.download = `Visualixy_Photo_${targetKB + 1}KB.jpg`;
                link.click();
            });
        }
    </script>

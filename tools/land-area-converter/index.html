    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col lg:flex-row gap-6">

                <div class="text-center max-w-lg mx-auto">
                    <div class="inline-flex p-3 rounded-2xl bg-emerald-50 text-emerald-600 text-2xl mb-2">📐</div>
                    <h1 class="text-xl sm:text-2xl font-black text-slate-900">Land & Area Unit Converter</h1>
                    <p class="text-xs text-slate-500 mt-1">Convert between Gaj, Bigha, Katha, Square Feet, Acre, and Hectares accurately.</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black text-slate-700 uppercase mb-1">Enter Area Value</label>
                        <input type="number" id="inputValue" value="1" oninput="convertArea()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold focus:bg-white focus:outline-none focus:border-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-700 uppercase mb-1">From Unit</label>
                        <select id="fromUnit" onchange="convertArea()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs font-bold focus:bg-white focus:outline-none focus:border-blue-600">
                            <option value="bigha">Bigha (Standard - 14,400 sq.ft)</option>
                            <option value="katha">Katha (720 sq.ft)</option>
                            <option value="gaj" selected>Gaj / Sq. Yard (9 sq.ft)</option>
                            <option value="sqft">Square Feet (Sq. Ft)</option>
                            <option value="acre">Acre (43,560 sq.ft)</option>
                            <option value="hectare">Hectare (107,639 sq.ft)</option>
                        </select>
                    </div>
                </div>

                <!-- Instant Multi-Unit Output Grid -->
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2">
                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Square Feet</span>
                        <p id="resSqft" class="text-sm sm:text-base font-black text-slate-900 mt-0.5">9 sq.ft</p>
                    </div>
                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Gaj (Sq. Yard)</span>
                        <p id="resGaj" class="text-sm sm:text-base font-black text-slate-900 mt-0.5">1 Gaj</p>

                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl">

                    </div>
                    <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Hectare</span>
                        <p id="resHectare" class="text-sm sm:text-base font-black text-slate-900 mt-0.5">0.00008 Ha</p>

        <aside class="w-full lg:w-80 shrink-0 space-y-4">
            <div class="bg-white p-2.5 rounded-3xl border border-slate-200 shadow-sm text-center">

                </div>
            </div>
        </aside>
    </main>

    <script>
        const sqftFactors = {
            sqft: 1,
            gaj: 9,
            katha: 720,
            bigha: 14400,
            acre: 43560,
            hectare: 107639
        };

        function convertArea() {
            const val = parseFloat(document.getElementById('inputValue').value) || 0;
            const from = document.getElementById('fromUnit').value;
            const totalSqFt = val * sqftFactors[from];

            document.getElementById('resSqft').innerText = (totalSqFt).toFixed(2) + " sq.ft";
            document.getElementById('resGaj').innerText = (totalSqFt / 9).toFixed(3) + " Gaj";
            document.getElementById('resBigha').innerText = (totalSqFt / 14400).toFixed(4) + " Bigha";
            document.getElementById('resKatha').innerText = (totalSqFt / 720).toFixed(3) + " Katha";
            document.getElementById('resAcre').innerText = (totalSqFt / 43560).toFixed(5) + " Acre";
            document.getElementById('resHectare').innerText = (totalSqFt / 107639).toFixed(6) + " Ha";
        }

        window.onload = convertArea;
    </script>
</body>
</html>

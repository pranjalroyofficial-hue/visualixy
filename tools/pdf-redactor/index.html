                        <button onclick="resetMasks()" class="text-rose-600 hover:underline">Undo All Masks</button>

                    <div class="overflow-auto border border-slate-300 rounded-2xl bg-slate-100 flex justify-center p-2">

    </main>

    <script>
        let baseImg = null;
        const canvas = document.getElementById('redactCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let startX, startY;
        let rectangles = [];

        document.getElementById('docInput').onchange = (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        baseImg = img;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        rectangles = [];
                        document.getElementById('dropArea').classList.add('hidden');
                        document.getElementById('editorPanel').classList.remove('hidden');
                        redraw();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.onmousedown = (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            startX = pos.x;
            startY = pos.y;
        };

        canvas.onmousemove = (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            redraw();
            ctx.fillStyle = "#000000";
            ctx.fillRect(startX, startY, pos.x - startX, pos.y - startY);
        };

        canvas.onmouseup = (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const pos = getMousePos(e);
            rectangles.push({ x: startX, y: startY, w: pos.x - startX, h: pos.y - startY });
            redraw();
        };

        function redraw() {
            ctx.drawImage(baseImg, 0, 0);
            ctx.fillStyle = "#000000";
            rectangles.forEach(r => {
                ctx.fillRect(r.x, r.y, r.w, r.h);
            });
        }

        function resetMasks() {
            rectangles = [];
            redraw();
        }

        function downloadRedacted() {
            const btn = document.getElementById('downloadRedactedBtn');
            window.triggerToolProcessAndDownload(btn, "Exporting Redacted File", function() {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.download = "Visualixy_Redacted_Doc.jpg";
                link.click();
            });
        }
    </script>

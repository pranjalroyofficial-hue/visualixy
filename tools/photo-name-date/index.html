                </div>

    <!-- Logic Engine -->
    <script>
        let sourceImg = null;
        let finalBlob = null;

        const dropArea = document.getElementById('dropArea');
        const imageInput = document.getElementById('imageInput');
        const editorPanel = document.getElementById('editorPanel');
        const canvas = document.getElementById('photoCanvas');

        // Set default today's date
        document.getElementById('photoDate').valueAsDate = new Date();

        dropArea.onclick = () => imageInput.click();

        imageInput.onchange = (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        sourceImg = img;
                        dropArea.classList.add('hidden');
                        editorPanel.classList.remove('hidden');
                        renderStampedPhoto();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        function resetTool() {
            sourceImg = null;
            imageInput.value = '';
            dropArea.classList.remove('hidden');
            editorPanel.classList.add('hidden');
        }

        async function renderStampedPhoto() {
            if (!sourceImg) return;

            const ctx = canvas.getContext('2d');
            const width = 350;
            const height = 450;
            canvas.width = width;
            canvas.height = height;

            // Draw Original Photo
            ctx.drawImage(sourceImg, 0, 0, width, height);

            // Bottom White Strip
            const stripHeight = 85;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, height - stripHeight, width, stripHeight);
            
            // Thin separation border
            ctx.strokeStyle = "#cbd5e1";
            ctx.lineWidth = 1;
            ctx.strokeRect(0, height - stripHeight, width, stripHeight);

            // Candidate Name & Date Text
            const name = document.getElementById('candidateName').value.trim() || "CANDIDATE NAME";
            const rawDate = document.getElementById('photoDate').value;
            let formattedDate = "DOP: " + new Date().toLocaleDateString('en-GB');
            if (rawDate) {
                const d = new Date(rawDate);
                formattedDate = "DOP: " + String(d.getDate()).padStart(2, '0') + "/" + String(d.getMonth() + 1).padStart(2, '0') + "/" + d.getFullYear();
            }

            ctx.fillStyle = "#000000";
            ctx.textAlign = "center";
            ctx.font = "bold 15px Arial, sans-serif";
            ctx.fillText(name.toUpperCase(), width / 2, height - stripHeight + 32);

            ctx.font = "bold 13px Arial, sans-serif";
            ctx.fillText(formattedDate, width / 2, height - stripHeight + 62);

            // Compression
            const targetKB = parseInt(document.getElementById('outputPreset').value) - 1;
            let quality = 0.92;
            let blob = null;

            for (let i = 0; i < 15; i++) {
                blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                if ((blob.size / 1024) <= targetKB || quality <= 0.1) {
                    break;
                }
                quality -= 0.08;
            }

            finalBlob = blob;
            document.getElementById('renderedSize').innerText = `Live Size: ${(blob.size / 1024).toFixed(1)} KB`;
        }

        function downloadStampedPhoto() {
            if (!finalBlob) return;
            const btn = document.getElementById('downloadBtn');
            window.triggerToolProcessAndDownload(btn, "Generating DOP Stamped Photo", function() {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(finalBlob);
                link.download = "Visualixy_DOP_Photo.jpg";
                link.click();
            });
        }
    </script>

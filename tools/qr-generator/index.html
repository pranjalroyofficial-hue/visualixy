    <!-- QR Generation Engine -->
    <script>
        const qrWrapper = document.getElementById('qrWrapper');
        let qrInstance = null;

        function buildQrCode() {
            const content = document.getElementById('qrText').value.trim() || 'https://visualixy.in';
            const colorDark = document.getElementById('qrColor').value;
            const colorLight = document.getElementById('qrBg').value;

            qrWrapper.innerHTML = '';
            qrInstance = new QRCode(qrWrapper, {
                text: content,
                width: 260,
                height: 260,
                colorDark: colorDark,
                colorLight: colorLight,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQrImage() {
            const btn = document.getElementById('downloadQrBtn');
            const targetDim = parseInt(document.getElementById('qrSize').value, 10);
            const content = document.getElementById('qrText').value.trim() || 'https://visualixy.in';
            const colorDark = document.getElementById('qrColor').value;
            const colorLight = document.getElementById('qrBg').value;

            window.triggerToolProcessAndDownload(btn, "Rendering Ultra HD Vector QR", function() {
                const hiddenContainer = document.createElement('div');
                new QRCode(hiddenContainer, {
                    text: content,
                    width: targetDim,
                    height: targetDim,
                    colorDark: colorDark,
                    colorLight: colorLight,
                    correctLevel: QRCode.CorrectLevel.H
                });

                setTimeout(() => {
                    const canvas = hiddenContainer.querySelector('canvas');
                    let dataUrl = '';
                    if (canvas) {
                        dataUrl = canvas.toDataURL('image/png');
                    } else {
                        const img = hiddenContainer.querySelector('img');
                        dataUrl = img ? img.src : '';
                    }

                    const link = document.createElement('a');
                    link.download = 'Visualixy_HD_QRCode.png';
                    link.href = dataUrl;
                    link.click();
                }, 50);
            });
        }

        buildQrCode();
    </script>

    <!-- Text to PDF Engine Logic -->
    <script>
        function renderPreview() {
            const title = document.getElementById('docTitle').value || 'Document';
            const body = document.getElementById('textContent').value || '';
            const font = document.getElementById('fontStyle').value;
            const size = document.getElementById('fontSize').value;

            const paper = document.getElementById('pdfPaper');
            paper.style.fontFamily = font;
            paper.style.fontSize = size;

            document.getElementById('previewHeading').innerText = title;
            document.getElementById('previewBody').innerText = body;
        }

        function exportTextToPdf() {
            const btn = document.getElementById('downloadPdfBtn');
            const title = document.getElementById('docTitle').value || 'Document';

            window.triggerToolProcessAndDownload(btn, "Rendering Clean A4 PDF", function() {
                const element = document.getElementById('pdfPaper');
                const opt = {
                    margin: 15,
                    filename: `Visualixy_${title.replace(/\s+/g, '_')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().set(opt).from(element).save();
            });
        }

        renderPreview();
    </script>

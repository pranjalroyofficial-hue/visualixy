    <!-- QR & Standee Graphic Engine -->
    <script>
        const canvas = document.getElementById('standeeCanvas');
        const ctx = canvas.getContext('2d');
        const hiddenQr = document.getElementById('hiddenQr');

        // High Resolution Counter Standee Dimensions (800 x 1200 px)
        canvas.width = 800;
        canvas.height = 1200;

        let qrCodeInstance = null;

        function generateStandee() {
            const upiId = document.getElementById('upiId').value.trim() || 'demo@upi';
            const payeeName = document.getElementById('payeeName').value.trim() || 'Merchant Store';
            const amount = document.getElementById('payAmount').value.trim();
            const theme = document.getElementById('themeColor').value;

            // Generate UPI String
            let upiString = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&cu=INR`;
            if (amount) upiString += `&am=${encodeURIComponent(amount)}`;

            // Render Hidden QR Code
            hiddenQr.innerHTML = '';
            qrCodeInstance = new QRCode(hiddenQr, {
                text: upiString,
                width: 420,
                height: 420,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const qrImg = hiddenQr.querySelector('img') || hiddenQr.querySelector('canvas');
                drawCanvasStandee(payeeName, upiId, amount, theme, qrImg);
            }, 50);
        }

        function drawCanvasStandee(name, upi, amt, color, qrElement) {
            // Background Card
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Header Banner
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, canvas.width, 240);

            // Title & Logos
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.font = "bold 38px system-ui, sans-serif";
            ctx.fillText("ACCEPTED HERE", 400, 95);

            ctx.font = "24px system-ui, sans-serif";
            ctx.fillText("BHIM • Google Pay • PhonePe • Paytm", 400, 160);

            // Merchant Name
            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 44px system-ui, sans-serif";
            ctx.fillText(name.toUpperCase(), 400, 330);

            // Draw QR Code
            if (qrElement) {
                // QR Box Border
                ctx.fillStyle = "#f8fafc";
                ctx.strokeStyle = "#e2e8f0";
                ctx.lineWidth = 4;
                ctx.strokeRect(170, 380, 460, 460);
                ctx.drawImage(qrElement, 190, 400, 420, 420);
            }

            // Fixed Amount Display (if entered)
            if (amt) {
                ctx.fillStyle = "#059669";
                ctx.font = "bold 36px system-ui, sans-serif";
                ctx.fillText(`AMOUNT: ₹${amt}`, 400, 890);
            }

            // UPI ID Display
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 26px monospace";
            ctx.fillText(`UPI ID: ${upi}`, 400, amt ? 940 : 900);

            // Footer Ribbon
            ctx.fillStyle = "#f1f5f9";
            ctx.fillRect(0, 1060, canvas.width, 140);
            ctx.fillStyle = "#334155";
            ctx.font = "bold 24px system-ui, sans-serif";
            ctx.fillText("Scan & Pay with Any UPI App", 400, 1140);
        }

        function downloadFullStandee() {
            const btn = document.getElementById('downloadStandeeBtn');
            window.triggerToolProcessAndDownload(btn, "Rendering HD Standee Poster", function() {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                const link = document.createElement('a');
                link.download = 'Visualixy_UPI_Standee.jpg';
                link.href = dataUrl;
                link.click();
            });
        }

        function downloadOnlyQr() {
            const qrImg = hiddenQr.querySelector('img') || hiddenQr.querySelector('canvas');
            if (!qrImg) return;

            const btn = document.getElementById('downloadQrBtn');
            window.triggerToolProcessAndDownload(btn, "Exporting High-Res QR", function() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 500;
                tempCanvas.height = 500;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.fillStyle = "#ffffff";
                tCtx.fillRect(0, 0, 500, 500);
                tCtx.drawImage(qrImg, 40, 40, 420, 420);

                const dataUrl = tempCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'Visualixy_Payment_QR.png';
                link.href = dataUrl;
                link.click();
            });
        }

        // Initialize default view
        generateStandee();
    </script>
